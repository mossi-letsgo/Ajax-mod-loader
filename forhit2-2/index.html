<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AJAX MODLOADER | จุดบริการมอดทุกเกม</title>
    <!-- แก้ไข Path ของ CSS (ตัด ../ ออก) -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/user.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo"><a href="index.html">Ajax Mod Downloader</a></div>
        <div class="nav-links" id="nav-links">
            <!-- แก้ไข Path ของ HTML (ลบตัว ้ และ ../ ออก) -->
            <a href="html/login.html" id="btn-login">เข้าสู่ระบบ</a>
            <a href="html/register.html" id="btn-register">สมัครสมาชิก</a>
        </div>
    </nav>

    <main class="container">
        <header class="page-header">
            <h1>รายการไฟล์ดาวน์โหลดทั้งหมด</h1>
            <p>ค้นหาและดาวน์โหลดไฟล์เวอร์ชันล่าสุดได้ฟรี</p>
        </header>

        <!-- Search Bar -->
        <div class="search-box">
            <input type="text" id="search-input" placeholder="ค้นหาชื่อไฟล์...">
        </div>

        <!-- File List Container -->
        <div class="file-grid" id="file-list">
            <p class="loading-text">กำลังโหลดรายการไฟล์...</p>
        </div>
    </main>
    <!-- Music Player Floating Widget -->
<div id="music-player-widget" style="position: fixed; bottom: 20px; right: 20px; background: #0f172a; color: #ffffff; padding: 10px 16px; border-radius: 30px; display: flex; align-items: center; gap: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); z-index: 9999; font-family: sans-serif; font-size: 13px;">
    <!-- ปุ่ม Play / Pause -->
    <button id="btn-play-pause" type="button" style="background: #2563eb; border: none; color: white; width: 34px; height: 34px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; shrink: 0;">▶</button>
    
    <div style="display: flex; flex-direction: column; min-width: 120px; max-width: 160px;">
        <!-- ชื่อเพลง -->
        <span id="player-track-title" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; color: #f8fafc; font-size: 12px;">กำลังโหลดเพลง...</span>
        
        <!-- ตัวปรับระดับเสียง (Volume Slider) -->
        <div style="display: flex; align-items: center; gap: 6px; margin-top: 3px;">
            <span style="font-size: 11px;">🔉</span>
            <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.15" style="width: 70px; height: 4px; cursor: pointer; accent-color: #3b82f6;">
            <span style="font-size: 11px;">🔊</span>
        </div>
    </div>

    <!-- ปุ่มเปลี่ยนเพลงถัดไป -->
    <button id="btn-next-track" type="button" title="เพลงถัดไป" style="background: transparent; border: none; color: #94a3b8; cursor: pointer; font-size: 16px; padding: 4px;">⏭</button>
    
    <!-- Audio HTML Element -->
    <audio id="bg-audio" loop></audio>
</div>
<!-- ย้ายออกนอกหน้าจอและทำขนาด 1x1px เพื่อให้ YouTube API ยอมทำงานเล่นเฉพาะเสียง -->
<div id="youtube-hidden-player" style="position: absolute; width: 1px; height: 1px; left: -9999px; top: -9999px; opacity: 0; pointer-events: none;"></div>

    <!-- Firebase & JS Scripts (แก้ไข Path ตัด ../ ออก) -->
    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/files.js"></script>
    <script type="module" src="../js/music-player.js"></script>
</body>
</html>
