<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แก้ไขข้อมูลส่วนตัว - File Hub</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/user.css">
</head>
<body class="auth-page">
    <div class="auth-card">
        <h2>แก้ไขข้อมูลส่วนตัว</h2>
        
        <!-- แสดงรูปโปรไฟล์ปัจจุบัน -->
        <div style="text-align: center; margin-bottom: 20px;">
            <img id="avatar-preview" src="" alt="Avatar" style="width: 90px; height: 90px; border-radius: 50%; object-fit: cover; border: 3px solid #2563eb;">
        </div>

        <form id="profile-form">
            <div class="form-group">
                <label for="profile-email">อีเมล</label>
                <input type="email" id="profile-email" disabled readonly style="background-color: #e2e8f0; cursor: not-allowed;">
            </div>
            <div class="form-group">
                <label for="profile-username">ชื่อผู้ใช้งาน (Username)</label>
                <input type="text" id="profile-username" required placeholder="กรอกชื่อใหม่ที่ต้องการ">
            </div>
            <div class="form-group">
                <label for="profile-photo">ลิงก์ URL รูปโปรไฟล์ (Image URL)</label>
                <input type="url" id="profile-photo" placeholder="https://example.com/image.png">
            </div>
            <p id="profile-message" class="error-message"></p>
            <button type="submit" id="btn-save-profile" class="btn-primary btn-block">บันทึกการเปลี่ยนแปลง</button>
        </form>
        <p class="auth-footer">
            <a href="../index.html">&larr; กลับหน้าหลัก</a>
        </p>
        
    </div>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module" src="../js/firebase-config.js"></script>
    <script type="module" src="../js/auth.js"></script>
    <script type="module" src="../js/profile.js"></script>
</body>
</html>
