<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - File Hub</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="auth-page">
    <div class="auth-card">
        <h2>เข้าสู่ระบบ</h2>
        <form id="login-form">
            <div class="form-group">
                <label for="email">อีเมล</label>
                <input type="email" id="email" required placeholder="example@email.com">
            </div>
            <div class="form-group">
                <label for="password">รหัสผ่าน</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <p id="auth-error" class="error-message"></p>
            <button type="submit" class="btn-primary btn-block">เข้าสู่ระบบ</button>
        </form>

        <!-- ปุ่ม Google Sign-In -->
        <div class="social-login">
            <p class="divider-text">หรือ</p>
            <button type="button" id="btn-google" class="btn-google btn-block">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google Logo" width="18">
                เข้าสู่ระบบด้วย Google
            </button>
        </div>

        <p class="auth-footer">
            ยังไม่มีบัญชี? <a href="register.html">สมัครสมาชิก</a> | <a href="../index.html">กลับหน้าหลัก</a>
        </p>
        
    </div>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module" src="../js/firebase-config.js"></script>
    <script type="module" src="../js/auth.js"></script>
</body>
</html>
