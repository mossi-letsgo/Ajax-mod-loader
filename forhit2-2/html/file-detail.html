<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายละเอียดไฟล์ - File Hub</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/user.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo"><a href="../index.html">FileHub</a></div>
        <div class="nav-links" id="nav-links">
            <a href="login.html" id="btn-login">เข้าสู่ระบบ</a>
            <a href="register.html" id="btn-register">สมัครสมาชิก</a>
        </div>
    </nav>

    <main class="container">
        <a href="../index.html" class="btn-back">&larr; กลับหน้าหลัก</a>

        <!-- File Detail Info -->
        <div class="file-detail-card" id="file-detail">
            <h1 id="file-title">กำลังโหลด...</h1>
            <p id="file-description"></p>
            <span class="upload-date" id="file-date"></span>
        </div>

        <!-- Versions Section -->
        <section class="version-section">
            <h2>เวอร์ชันทั้งหมด (Versions)</h2>
            <div id="version-list" class="version-list">
                <!-- รายการ Version และปุ่มดาวน์โหลดจะถูกสร้างผ่าน JS -->
            </div>
        </section>

        <!-- Comments Section -->
        <section class="comment-section">
            <h2>ความคิดเห็น (Comments)</h2>

            <!-- ฟอร์มส่ง Comment (แสดงเฉพาะคนที่ล็อกอินแล้ว) -->
            <div id="comment-form-container">
                <form id="comment-form" class="comment-form">
                    <textarea id="comment-input" placeholder="พิมพ์ความคิดเห็นของคุณที่นี่..." required></textarea>
                    <button type="submit" class="btn-primary">ส่งความคิดเห็น</button>
                </form>
            </div>

            <!-- ข้อความแจ้งเตือนให้ Login (แสดงเฉพาะคนที่ยังไม่ล็อกอิน) -->
            <div id="login-prompt" class="login-prompt" style="display: none;">
                <p>กรุณา <a href="login.html">เข้าสู่ระบบ</a> หรือ <a href="register.html">สมัครสมาชิก</a> เพื่อแสดงความคิดเห็น</p>
            </div>

            <!-- รายการ Comment ทั้งหมด -->
            <div id="comments-list" class="comments-list">
                <!-- โหลด Comment ผ่าน comments.js -->
            </div>
        </section>
        
    </main>
    <!-- Music Player Floating Widget -->
<div id="music-player-widget" style="position: fixed; bottom: 20px; right: 20px; background: #0f172a; color: #ffffff; padding: 10px 16px; border-radius: 30px; display: flex; align-items: center; gap: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); z-index: 9999; font-family: sans-serif; font-size: 13px;">
    <!-- ปุ่ม Play / Pause -->
    <button id="btn-play-pause" type="button" style="background: #2563eb; border: none; color: white; width: 34px; height: 34px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; shrink: 0;">▶</button>
    
    <div style="display: flex; flex-direction: column; min-width: 120px; max-width: 160px;">
        <!-- ชื่อเพลง -->
        <span id="player-track-title" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; color: #f8fafc; font-size: 12px;">กำลังโหลดเพลง...</span>
        
        <!-- ตัวปรับระดับเสียง (Volume Slider) -->
        <div style="display: flex; align-items: center; gap: 6px; margin-top: 3px;">
            <span style="font-size: 11px;">🔉</span>
            <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.15" style="width: 70px; height: 4px; cursor: pointer; accent-color: #3b82f6;">
            <span style="font-size: 11px;">🔊</span>
        </div>
    </div>

    <!-- ปุ่มเปลี่ยนเพลงถัดไป -->
    <button id="btn-next-track" type="button" title="เพลงถัดไป" style="background: transparent; border: none; color: #94a3b8; cursor: pointer; font-size: 16px; padding: 4px;">⏭</button>
    
    <!-- Audio HTML Element -->
    <audio id="bg-audio" loop></audio>
</div>
<!-- ย้ายออกนอกหน้าจอและทำขนาด 1x1px เพื่อให้ YouTube API ยอมทำงานเล่นเฉพาะเสียง -->
<div id="youtube-hidden-player" style="position: absolute; width: 1px; height: 1px; left: -9999px; top: -9999px; opacity: 0; pointer-events: none;"></div>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module" src="../js/firebase-config.js"></script>
    <script type="module" src="../js/auth.js"></script>
    <script type="module" src="../js/file-detail.js"></script>
    <script type="module" src="../js/files.js"></script>
    <script type="module" src="../js/comments.js"></script>
    <script type="module" src="../js/music-player.js"></script>
</body>
</html>
