<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายละเอียดไฟล์ - File Hub</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/user.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo"><a href="../index.html">FileHub</a></div>
        <div class="nav-links" id="nav-links">
            <a href="login.html" id="btn-login">เข้าสู่ระบบ</a>
            <a href="register.html" id="btn-register">สมัครสมาชิก</a>
        </div>
    </nav>

    <main class="container">
        <a href="../index.html" class="btn-back">&larr; กลับหน้าหลัก</a>

        <!-- File Detail Info -->
        <div class="file-detail-card" id="file-detail">
            <h1 id="file-title">กำลังโหลด...</h1>
            <p id="file-description"></p>
            <span class="upload-date" id="file-date"></span>
        </div>

        <!-- Versions Section -->
        <section class="version-section">
            <h2>เวอร์ชันทั้งหมด (Versions)</h2>
            <div id="version-list" class="version-list">
                <!-- รายการ Version และปุ่มดาวน์โหลดจะถูกสร้างผ่าน JS -->
            </div>
        </section>

        <!-- Comments Section -->
        <section class="comment-section">
            <h2>ความคิดเห็น (Comments)</h2>

            <!-- ฟอร์มส่ง Comment (แสดงเฉพาะคนที่ล็อกอินแล้ว) -->
            <div id="comment-form-container">
                <form id="comment-form" class="comment-form">
                    <textarea id="comment-input" placeholder="พิมพ์ความคิดเห็นของคุณที่นี่..." required></textarea>
                    <button type="submit" class="btn-primary">ส่งความคิดเห็น</button>
                </form>
            </div>

            <!-- ข้อความแจ้งเตือนให้ Login (แสดงเฉพาะคนที่ยังไม่ล็อกอิน) -->
            <div id="login-prompt" class="login-prompt" style="display: none;">
                <p>กรุณา <a href="login.html">เข้าสู่ระบบ</a> หรือ <a href="register.html">สมัครสมาชิก</a> เพื่อแสดงความคิดเห็น</p>
            </div>

            <!-- รายการ Comment ทั้งหมด -->
            <div id="comments-list" class="comments-list">
                <!-- โหลด Comment ผ่าน comments.js -->
            </div>
        </section>
        
    </main>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module" src="../js/firebase-config.js"></script>
    <script type="module" src="../js/auth.js"></script>
    <script type="module" src="../js/files.js"></script>
    <script type="module" src="../js/comments.js"></script>
</body>
</html>
