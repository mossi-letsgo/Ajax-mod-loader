<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สมัครสมาชิก - File Hub</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="auth-page">
    <div class="auth-card">
        <h2>สมัครสมาชิก</h2>
        <form id="register-form">
            <div class="form-group">
                <label for="username">ชื่อผู้ใช้งาน (Username)</label>
                <input type="text" id="username" required placeholder="ชื่อที่จะแสดงในคอมเมนต์">
            </div>
            <div class="form-group">
                <label for="email">อีเมล</label>
                <input type="email" id="email" required placeholder="example@email.com">
            </div>
            <div class="form-group">
                <label for="password">รหัสผ่าน</label>
                <input type="password" id="password" required placeholder="อย่างน้อย 6 ตัวอักษร">
            </div>
            <p id="auth-error" class="error-message"></p>
            <button type="submit" class="btn-primary btn-block">ยืนยันสมัครสมาชิก</button>
        </form>
        <p class="auth-footer">
            มีบัญชีอยู่แล้ว? <a href="login.html">เข้าสู่ระบบ</a> | <a href="../index.html">กลับหน้าหลัก</a>
        </p>
    </div>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module" src="../js/firebase-config.js"></script>
    <script type="module" src="../js/auth.js"></script>
</body>
</html>
